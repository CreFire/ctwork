{
  "__comment": "方舟纪元 ARK ERA - Luban 全局配置",
  "version": "1.0.0",
  "desc": "Luban 配置中心：管理所有游戏数值表、Bean、Enum 的生成管线",
  "targetLanguage": ["typescript", "go", "json"],
  "pipeline": {
    "inputDataDir": "server/luban/tables",
    "inputDefineDir": "server/luban/Defines",
    "outputCodeDir": {
      "typescript": "src/game/generated",
      "go": "server/internal/config/gen",
      "json": "src/game/generated/data"
    },
    "outputDataDir": {
      "client": "src/game/generated/data",
      "server": "server/data"
    }
  },
  "groups": {
    "c": "client only - 前端表现层",
    "s": "server only - 服务端权威",
    "c,s": "both - 双端共享"
  },
  "tables": [
    { "name": "tb_global", "file": "tb_global.csv", "group": "c,s", "type": "table", "mode": "map", "key": "key", "desc": "全局常量表 单例KV" },
    { "name": "tb_building", "file": "tb_building.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "建筑表" },
    { "name": "tb_click_upgrade", "file": "tb_click_upgrade.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "点击升级表" },
    { "name": "tb_era", "file": "tb_era.csv", "group": "c,s", "type": "table", "mode": "list", "desc": "纪元表" },
    { "name": "tb_research", "file": "tb_research.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "科技树" },
    { "name": "tb_route", "file": "tb_route.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "飞升路线" },
    { "name": "tb_route_upgrade", "file": "tb_route_upgrade.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "路线升级" },
    { "name": "tb_core_upgrade", "file": "tb_core_upgrade.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "星核遗产" },
    { "name": "tb_story", "file": "tb_story.csv", "group": "c,s", "type": "table", "mode": "list", "desc": "倒计时剧情" },
    { "name": "tb_random_event", "file": "tb_random_event.csv", "group": "c,s", "type": "table", "mode": "map", "key": "id", "desc": "随机事件" },
    { "name": "tb_res_meta", "file": "tb_res_meta.csv", "group": "c", "type": "table", "mode": "map", "key": "id", "desc": "资源元信息" },
    { "name": "tb_leaderboard_name", "file": "tb_leaderboard_name.csv", "group": "c", "type": "table", "mode": "list", "desc": "排行榜名字库" }
  ],
  "beans": [
    { "name": "Cost", "file": "bean_cost.csv", "group": "c,s" },
    { "name": "Effect", "file": "bean_effect.csv", "group": "c,s" },
    { "name": "Building", "file": "bean_building.csv", "group": "c,s" },
    { "name": "ClickUpgrade", "file": "bean_click_upgrade.csv", "group": "c,s" },
    { "name": "Era", "file": "bean_era.csv", "group": "c,s" },
    { "name": "Research", "file": "bean_research.csv", "group": "c,s" },
    { "name": "Route", "file": "bean_route.csv", "group": "c,s" },
    { "name": "RouteUpgrade", "file": "bean_route_upgrade.csv", "group": "c,s" },
    { "name": "CoreUpgrade", "file": "bean_core_upgrade.csv", "group": "c,s" },
    { "name": "StoryEvent", "file": "bean_story.csv", "group": "c,s" },
    { "name": "RandomEvent", "file": "bean_random_event.csv", "group": "c,s" },
    { "name": "ResMeta", "file": "bean_res_meta.csv", "group": "c,s" }
  ],
  "enums": [
    { "name": "ResourceType", "file": "enum_resource_type.csv", "group": "c,s" },
    { "name": "ChainType", "file": "enum_chain_type.csv", "group": "c,s" },
    { "name": "RouteId", "file": "enum_route_id.csv", "group": "c,s" },
    { "name": "EffectKind", "file": "enum_effect_kind.csv", "group": "c,s" },
    { "name": "EventKind", "file": "enum_event_kind.csv", "group": "c,s" },
    { "name": "EventTone", "file": "enum_event_tone.csv", "group": "c,s" }
  ],
  "gen": {
    "typescript": {
      "target": "typescript-json",
      "jsonFormat": "pretty",
      "namingConvention": "camelCase",
      "outputTables": "Tables.ts",
      "outputBeans": "Beans.ts",
      "outputEnums": "Enums.ts"
    },
    "go": {
      "package": "config",
      "outputDir": "server/internal/config/gen"
    }
  },
  "validation": {
    "strict": true,
    "checkDuplicateId": true,
    "checkEnumValue": true,
    "checkForeignKey": true,
    "rules": [
      "tb_building.scale must be >=1.0 and <=2.0",
      "tb_building.per_sec must be >0",
      "tb_research.era must be 0-5",
      "tb_route_upgrade.max must be 1-100",
      "tb_core_upgrade.max must be 1-100"
    ]
  }
}
